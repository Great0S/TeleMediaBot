{% extends "base.html" %}

{% block title %}Groups - TeleMedia{% endblock %}

{% block extra_css %}
<style>
    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
    }
    
    .page-header h1 {
        margin: 0;
        font-size: 2rem;
        color: var(--text-primary);
    }
    
    .search-bar {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 2rem;
    }
    
    .search-bar input {
        flex: 1;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: 0.5rem;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-size: 1rem;
    }
    
    .groups-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
    }
    
    .group-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 1rem;
        padding: 1.5rem;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .group-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-md);
    }
    
    .group-header {
        display: flex;
        align-items: flex-start;
        gap: 1rem;
        margin-bottom: 1rem;
    }
    
    .group-avatar {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
        flex-shrink: 0;
    }
    
    .group-info {
        flex: 1;
        min-width: 0;
    }
    
    .group-name {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text-primary);
        margin: 0 0 0.25rem 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    
    .group-username {
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin: 0;
    }
    
    .group-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
        margin-bottom: 1rem;
        padding: 1rem;
        background: var(--bg-secondary);
        border-radius: 0.75rem;
    }
    
    .stat-item {
        text-align: center;
    }
    
    .stat-value {
        display: block;
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--primary-color);
    }
    
    .stat-label {
        display: block;
        font-size: 0.75rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-top: 0.25rem;
    }
    
    .group-actions {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
    }
    
    .action-btn {
        padding: 0.6rem;
        font-size: 0.9rem;
        border-radius: 0.5rem;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
    }
    
    .action-btn.primary {
        background: var(--primary-color);
        color: white;
    }
    
    .action-btn.secondary {
        background: var(--bg-secondary);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
    }
    
    .action-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    
    .group-badge {
        display: inline-block;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        margin-left: 0.5rem;
    }
    
    .group-badge.type {
        background: #dbeafe;
        color: #1d4ed8;
    }
    
    .group-badge.verified {
        background: #d1fae5;
        color: #065f46;
    }
    
    .empty-state {
        text-align: center;
        padding: 4rem 2rem;
        background: var(--card-bg);
        border: 2px dashed var(--border-color);
        border-radius: 1rem;
    }
    
    .empty-state-icon {
        font-size: 4rem;
        margin-bottom: 1rem;
        opacity: 0.5;
    }
    
    .empty-state h3 {
        margin: 0 0 0.5rem 0;
        color: var(--text-primary);
    }
    
    .empty-state p {
        color: var(--text-secondary);
        margin: 0 0 1.5rem 0;
    }
    
    .filter-tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 2rem;
        background: var(--bg-secondary);
        padding: 0.5rem;
        border-radius: 0.75rem;
        overflow-x: auto;
    }
    
    .filter-tab {
        padding: 0.6rem 1.2rem;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        border-radius: 0.5rem;
        cursor: pointer;
        font-weight: 600;
        white-space: nowrap;
        transition: all 0.2s;
    }
    
    .filter-tab.active {
        background: var(--primary-color);
        color: white;
    }
    
    .loading-spinner {
        text-align: center;
        padding: 3rem;
    }
    
    .spinner-large {
        width: 60px;
        height: 60px;
        border: 4px solid var(--border-color);
        border-top-color: var(--primary-color);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 1rem;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>👥 Groups</h1>
    <button class="btn btn-primary" onclick="refreshGroups()">
        <span>🔄</span> Refresh
    </button>
</div>

<div class="filter-tabs">
    <button class="filter-tab active" data-filter="all" onclick="filterGroups('all')">
        All Groups
    </button>
    <button class="filter-tab" data-filter="group" onclick="filterGroups('group')">
        Groups Only
    </button>
    <button class="filter-tab" data-filter="supergroup" onclick="filterGroups('supergroup')">
        Supergroups
    </button>
</div>

<div class="search-bar">
    <input 
        type="text" 
        id="search-input" 
        placeholder="Search groups by name or username..."
        oninput="searchGroups()"
    />
</div>

<div id="loading-spinner" class="loading-spinner" style="display: none;">
    <div class="spinner-large"></div>
    <p>Loading groups...</p>
</div>

<div id="groups-grid" class="groups-grid">
    <!-- Groups will be loaded here -->
</div>

<div id="empty-state" class="empty-state" style="display: none;">
    <div class="empty-state-icon">📭</div>
    <h3>No groups found</h3>
    <p>You haven't joined any groups yet, or they couldn't be loaded.</p>
    <button class="btn btn-primary" onclick="refreshGroups()">
        <span>🔄</span> Refresh Groups
    </button>
</div>

<script>
    let allGroups = [];
    let filteredGroups = [];
    let currentFilter = 'all';
    
    // Load groups on page load
    async function loadGroups() {
        showLoading();
        
        try {
            const response = await fetch('/groups');
            const data = await response.json();
            
            if (data.groups && data.groups.length > 0) {
                allGroups = data.groups.map(g => ({
                    id: g.value,
                    name: g.label,
                    username: g.value.startsWith('@') ? g.value : null,
                    type: 'group', // Could be enhanced with actual type from API
                    members: Math.floor(Math.random() * 10000), // Placeholder
                    unread: Math.floor(Math.random() * 50), // Placeholder
                    lastMessage: new Date(Date.now() - Math.random() * 7 * 24 * 60 * 60 * 1000) // Random within last week
                }));
                
                filteredGroups = [...allGroups];
                renderGroups();
            } else {
                showEmptyState();
            }
        } catch (err) {
            console.error('Failed to load groups:', err);
            Toast.error('Failed to load groups');
            showEmptyState();
        } finally {
            hideLoading();
        }
    }
    
    function renderGroups() {
        const container = document.getElementById('groups-grid');
        const emptyState = document.getElementById('empty-state');
        
        if (filteredGroups.length === 0) {
            container.style.display = 'none';
            emptyState.style.display = 'block';
            return;
        }
        
        container.style.display = 'grid';
        emptyState.style.display = 'none';
        container.innerHTML = '';
        
        filteredGroups.forEach(group => {
            const card = createGroupCard(group);
            container.appendChild(card);
        });
    }
    
    function createGroupCard(group) {
        const card = document.createElement('div');
        card.className = 'group-card';
        
        // Get first letter for avatar
        const initial = group.name.charAt(0).toUpperCase();
        
        card.innerHTML = `
            <div class="group-header">
                <div class="group-avatar">${initial}</div>
                <div class="group-info">
                    <h3 class="group-name" title="${escapeHtml(group.name)}">
                        ${escapeHtml(group.name)}
                        ${group.type === 'supergroup' ? '<span class="group-badge type">Super</span>' : ''}
                    </h3>
                    <p class="group-username">${group.username || group.id}</p>
                </div>
            </div>
            
            <div class="group-stats">
                <div class="stat-item">
                    <span class="stat-value">${formatNumber(group.members)}</span>
                    <span class="stat-label">Members</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">${group.unread || 0}</span>
                    <span class="stat-label">Unread</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">${formatDate(group.lastMessage, 'relative')}</span>
                    <span class="stat-label">Last Msg</span>
                </div>
            </div>
            
            <div class="group-actions">
                <button class="action-btn primary" onclick="fetchMessages('${escapeHtml(group.id)}')">
                    📥 Fetch Messages
                </button>
                <button class="action-btn secondary" onclick="viewGroupInfo('${escapeHtml(group.id)}')">
                    ℹ️ View Info
                </button>
            </div>
        `;
        
        return card;
    }
    
    function filterGroups(filter) {
        currentFilter = filter;
        
        // Update active tab
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.classList.toggle('active', tab.dataset.filter === filter);
        });
        
        // Filter groups
        if (filter === 'all') {
            filteredGroups = [...allGroups];
        } else {
            filteredGroups = allGroups.filter(g => g.type === filter);
        }
        
        // Apply search if active
        const searchTerm = document.getElementById('search-input').value.trim();
        if (searchTerm) {
            searchGroups();
        } else {
            renderGroups();
        }
    }
    
    function searchGroups() {
        const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
        
        if (!searchTerm) {
            filterGroups(currentFilter);
            return;
        }
        
        // Start with current filter
        let baseGroups = currentFilter === 'all' ? allGroups : allGroups.filter(g => g.type === currentFilter);
        
        filteredGroups = baseGroups.filter(group => {
            return group.name.toLowerCase().includes(searchTerm) ||
                   (group.username && group.username.toLowerCase().includes(searchTerm)) ||
                   group.id.toLowerCase().includes(searchTerm);
        });
        
        renderGroups();
    }
    
    function fetchMessages(groupId) {
        // Redirect to dashboard with group pre-filled
        window.location.href = `/?group=${encodeURIComponent(groupId)}`;
    }
    
    function viewGroupInfo(groupId) {
        const group = allGroups.find(g => g.id === groupId);
        if (!group) return;
        
        const content = `
            <div style="padding: 1rem;">
                <div style="text-align: center; margin-bottom: 1.5rem;">
                    <div style="width: 100px; height: 100px; margin: 0 auto 1rem; border-radius: 50%; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); display: flex; align-items: center; justify-content: center; font-size: 3rem;">
                        ${group.name.charAt(0).toUpperCase()}
                    </div>
                    <h2 style="margin: 0 0 0.5rem 0;">${escapeHtml(group.name)}</h2>
                    <p style="color: var(--text-secondary); margin: 0;">${group.username || group.id}</p>
                </div>
                
                <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--border-color);">
                
                <div style="display: grid; gap: 1rem;">
                    <div>
                        <strong>Type:</strong> ${group.type === 'supergroup' ? 'Supergroup' : 'Group'}
                    </div>
                    <div>
                        <strong>Members:</strong> ${formatNumber(group.members)}
                    </div>
                    <div>
                        <strong>Unread Messages:</strong> ${group.unread || 0}
                    </div>
                    <div>
                        <strong>Last Message:</strong> ${formatDate(group.lastMessage, 'long')}
                    </div>
                    <div>
                        <strong>Group ID:</strong> <code style="background: var(--bg-secondary); padding: 0.25rem 0.5rem; border-radius: 0.25rem;">${escapeHtml(group.id)}</code>
                    </div>
                </div>
            </div>
        `;
        
        Modal.show({
            title: 'Group Information',
            content: content,
            buttons: [
                { 
                    text: 'Fetch Messages', 
                    onClick: () => {
                        Modal.hide();
                        fetchMessages(groupId);
                    }
                },
                { text: 'Close', primary: true, onClick: () => Modal.hide() }
            ]
        });
    }
    
    async function refreshGroups() {
        Toast.info('Refreshing groups...');
        await loadGroups();
        Toast.success('Groups refreshed');
    }
    
    function showLoading() {
        document.getElementById('loading-spinner').style.display = 'block';
        document.getElementById('groups-grid').style.display = 'none';
        document.getElementById('empty-state').style.display = 'none';
    }
    
    function hideLoading() {
        document.getElementById('loading-spinner').style.display = 'none';
    }
    
    function showEmptyState() {
        document.getElementById('groups-grid').style.display = 'none';
        document.getElementById('empty-state').style.display = 'block';
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        loadGroups();
        
        // Set active nav
        if (window.Navigation) {
            window.Navigation.setActiveNavItem('groups');
            window.Navigation.updateBreadcrumbs(['Groups']);
        }
    });
</script>
{% endblock %}
