<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}TeleMedia{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css" />
    <link rel="stylesheet" href="/static/css/components.css" />
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">📱</span>
                <span class="logo-text">TeleMedia</span>
            </div>
            <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
        </div>
        
        <div class="sidebar-menu">
            <a href="/" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}" data-page="dashboard">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="/messages" class="nav-item {% if active_page == 'messages' %}active{% endif %}" data-page="messages">
                <span class="nav-icon">💬</span>
                <span class="nav-label">Messages</span>
            </a>
            <a href="/media" class="nav-item {% if active_page == 'media' %}active{% endif %}" data-page="media">
                <span class="nav-icon">🎬</span>
                <span class="nav-label">Media</span>
            </a>
            <a href="/groups" class="nav-item {% if active_page == 'groups' %}active{% endif %}" data-page="groups">
                <span class="nav-icon">👥</span>
                <span class="nav-label">Groups</span>
            </a>
            <a href="/channels" class="nav-item {% if active_page == 'channels' %}active{% endif %}" data-page="channels">
                <span class="nav-icon">📢</span>
                <span class="nav-label">Channels</span>
            </a>
            <a href="/bot-tools" class="nav-item {% if active_page == 'bot-tools' %}active{% endif %}" data-page="bot-tools">
                <span class="nav-icon">🤖</span>
                <span class="nav-label">Bot Tools</span>
            </a>
            <a href="/admin" class="nav-item {% if active_page == 'admin' %}active{% endif %}" data-page="admin">
                <span class="nav-icon">🔐</span>
                <span class="nav-label">Admin</span>
            </a>
            <a href="/analytics" class="nav-item {% if active_page == 'analytics' %}active{% endif %}" data-page="analytics">
                <span class="nav-icon">📈</span>
                <span class="nav-label">Analytics</span>
            </a>
        </div>
        
        <div class="sidebar-footer">
            <div class="user-info">
                <span class="user-avatar">👤</span>
                <span class="user-name">User</span>
            </div>
            <a href="/settings" class="nav-item-small">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">Settings</span>
            </a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="main-wrapper">
        <!-- Top Bar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Open menu">☰</button>
                <div class="breadcrumbs">
                    {% block breadcrumbs %}
                    <span class="breadcrumb-item">Dashboard</span>
                    {% endblock %}
                </div>
            </div>
            
            <div class="topbar-right">
                <button class="icon-button" id="notifications-btn" aria-label="Notifications">
                    🔔
                    <span class="badge" id="notification-badge">3</span>
                </button>
                <button class="icon-button" id="theme-toggle" aria-label="Toggle theme">🌙</button>
                <button class="icon-button" id="user-menu-btn" aria-label="User menu">👤</button>
            </div>
        </header>

        <!-- Page Content -->
        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="modal-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="spinner-large"></div>
    </div>

    <!-- Base Scripts -->
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/components.js"></script>
    <script src="/static/js/navigation.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
